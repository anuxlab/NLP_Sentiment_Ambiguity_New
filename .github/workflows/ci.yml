name: NLP Research CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nlp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-unit:
    name: Static checks and artifact tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest tabulate

      - name: Compile Python sources
        run: python -m py_compile src/*.py tests/*.py ci/*.py

      - name: Check shell syntax
        run: bash -n run_all.sh

      - name: Run deterministic and saved-artifact tests
        run: pytest -q tests

      - name: Generate evidence audit report
        run: python ci/audit_evidence.py --output results/ci_evidence_audit.json

      - name: Upload test and audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nlp-ci-evidence-${{ github.run_id }}
          path: |
            results/ci_evidence_audit.json
            .pytest_cache/v/cache/nodeids
          if-no-files-found: warn
          retention-days: 30
