name: DynaSent Multi-Seed Evaluation

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: 'Space-separated reproducibility seeds'
        required: true
        default: '0 1 2 3 4'
        type: string
      backend:
        description: 'Model backend to evaluate'
        required: true
        default: 'tiny-bert'
        type: choice
        options:
          - tiny-bert
          - tfidf
      tiny_bert_lr:
        description: 'Tiny-BERT learning rate (ignored for TF-IDF)'
        required: true
        default: '0.00002'
        type: string
      budget:
        description: 'Training examples per condition and seed'
        required: true
        default: '100'
        type: string
      epochs:
        description: 'Training epochs'
        required: true
        default: '10'
        type: string
      include_null_soft_only:
        description: 'Include the separately reported null-majority soft-target condition'
        required: true
        default: true
        type: boolean
      null_soft_fraction:
        description: 'Fraction of null-majority examples in the additional condition'
        required: true
        default: '0.5'
        type: string

permissions:
  contents: read

concurrency:
  group: dynasent-multiseed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Remove stale experiment and analysis outputs
        run: |
          rm -rf results/dynasent_multiseed
          rm -rf results/dynasent_analysis/tiny-bert results/dynasent_analysis/tfidf
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Validate code and tests
        run: |
          python -m py_compile src/*.py tests/*.py
          bash -n run_all.sh run_dynasent_pilot.sh
          pytest -q tests
      - name: Validate seed input
        id: settings
        env:
          SEEDS_INPUT: ${{ inputs.seeds }}
          BUDGET_INPUT: ${{ inputs.budget }}
          EPOCHS_INPUT: ${{ inputs.epochs }}
          BACKEND_INPUT: ${{ inputs.backend }}
          TINY_BERT_LR_INPUT: ${{ inputs.tiny_bert_lr }}
          INCLUDE_NULL_INPUT: ${{ inputs.include_null_soft_only }}
          NULL_FRACTION_INPUT: ${{ inputs.null_soft_fraction }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          seeds=os.environ['SEEDS_INPUT'].split()
          if not seeds or any(not s.isdigit() for s in seeds): raise SystemExit('seeds must be space-separated non-negative integers')
          if len(set(seeds)) != len(seeds): raise SystemExit('seeds must be unique')
          if os.environ['BACKEND_INPUT'] not in {'tiny-bert','tfidf'}: raise SystemExit('unsupported backend')
          lr=float(os.environ['TINY_BERT_LR_INPUT'])
          if lr <= 0: raise SystemExit('tiny_bert_lr must be positive')
          if int(os.environ['BUDGET_INPUT']) < 2: raise SystemExit('budget must be >= 2')
          if int(os.environ['EPOCHS_INPUT']) < 1: raise SystemExit('epochs must be positive')
          f=float(os.environ['NULL_FRACTION_INPUT'])
          if not 0 < f < 1: raise SystemExit('null fraction must be between 0 and 1')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('seeds='+' '.join(seeds)+'\n')
              out.write('include_null='+os.environ['INCLUDE_NULL_INPUT'].lower()+'\n')
              out.write('backend='+os.environ['BACKEND_INPUT']+'\n')
              out.write('tiny_bert_lr='+os.environ['TINY_BERT_LR_INPUT']+'\n')
          PY
      - name: Run full-test evaluation for both rounds
        env:
          PYTHONUNBUFFERED: '1'
          BACKEND: ${{ inputs.backend }}
          TINY_BERT_LR: ${{ inputs.tiny_bert_lr }}
          BUDGET: ${{ inputs.budget }}
          EPOCHS: ${{ inputs.epochs }}
          SEEDS: ${{ steps.settings.outputs.seeds }}
          INCLUDE_NULL: ${{ steps.settings.outputs.include_null }}
          NULL_FRACTION: ${{ inputs.null_soft_fraction }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf results/dynasent_multiseed
          mkdir -p results/dynasent_multiseed
          extra_args=()
          if [[ "$INCLUDE_NULL" == "true" ]]; then
            extra_args+=(--include-null-soft-only --null-soft-fraction "$NULL_FRACTION")
          fi
          for round_name in round1 round2; do
            log_path="results/dynasent_multiseed/${round_name}_run.log"
            cmd=(python src/run_dynasent_experiments.py
              --data data/dynasent-main.zip
              --round "$round_name"
              --backend "$BACKEND"
              --budget "$BUDGET"
              --eval-size 0
              --epochs "$EPOCHS"
              --seeds $SEEDS
              --out-dir "results/dynasent_multiseed/$round_name")
            if [[ "$BACKEND" == "tiny-bert" ]]; then cmd+=(--tiny-bert-lr "$TINY_BERT_LR"); fi
            printf 'COMMAND:'; printf ' %q' "${cmd[@]}"; printf '\n'
            "${cmd[@]}" "${extra_args[@]}" 2>&1 | tee "$log_path"
            grep -F "[run] round=${round_name} backend=${BACKEND} " "$log_path" >/dev/null
            BACKEND_EXPECTED="$BACKEND" ROUND_EXPECTED="$round_name" python -c 'import json,os; from pathlib import Path; p=Path("results/dynasent_multiseed")/os.environ["ROUND_EXPECTED"]; c=json.loads((p/"config_and_audit.json").read_text()); r=json.loads((p/"metrics.json").read_text()); assert c["args"]["backend"]==os.environ["BACKEND_EXPECTED"] and c["args"]["round"]==os.environ["ROUND_EXPECTED"]; assert r and {x["backend"] for x in r}=={os.environ["BACKEND_EXPECTED"]} and {x["round"] for x in r}=={os.environ["ROUND_EXPECTED"]}'
          done
      - name: Aggregate multi-seed results and audit completeness
        shell: bash
        run: |
          aggregate_args=()
          if [[ "${{ steps.settings.outputs.include_null }}" == "true" ]]; then
            aggregate_args+=(--expect-null-augmented)
          fi
          python src/aggregate_dynasent_multiseed.py \
            --results-root results/dynasent_multiseed \
            --rounds round1 round2 \
            "${aggregate_args[@]}"
      - name: Verify final experiment artifact provenance and completeness
        env:
          BACKEND: ${{ steps.settings.outputs.backend }}
          SEEDS: ${{ steps.settings.outputs.seeds }}
          INCLUDE_NULL: ${{ steps.settings.outputs.include_null }}
        shell: bash
        run: |
          set -Eeuo pipefail
          verify_args=()
          if [[ "$INCLUDE_NULL" != "true" ]]; then
            verify_args+=(--allow-three-conditions)
          fi
          python src/verify_dynasent_artifact.py \
            --results-root results/dynasent_multiseed \
            --backend "$BACKEND" \
            --seeds $SEEDS \
            "${verify_args[@]}"
          test -s results/dynasent_multiseed/verification_report.json
          python -c 'import json; from pathlib import Path; r=json.loads(Path("results/dynasent_multiseed/verification_report.json").read_text()); assert r["status"] == "passed" and r["all_complete"]'
      - name: Run statistical validation and generate final results analysis
        env:
          BACKEND: ${{ steps.settings.outputs.backend }}
          SEEDS: ${{ steps.settings.outputs.seeds }}
        shell: bash
        run: |
          set -Eeuo pipefail
          analysis_dir="results/dynasent_analysis/${BACKEND}"
          rm -rf "$analysis_dir"
          python src/analyze_dynasent_results.py \
            --input-dir results/dynasent_multiseed \
            --output-dir "$analysis_dir" \
            --expected-seeds $SEEDS \
            --bootstrap-replicates 10000 \
            --permutation-replicates 10000 \
            --source-run-id "$GITHUB_RUN_ID" \
            --source-artifact-name "dynasent-multiseed-${BACKEND}-${GITHUB_RUN_ID}"
          test -s "$analysis_dir/analysis_manifest.json"
          test -s "$analysis_dir/primary_js_comparisons.csv"
          test -s "$analysis_dir/FINAL_RESULTS_REPORT.md"
      - name: Upload full-test results and statistical analysis
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dynasent-multiseed-${{ inputs.backend }}-${{ github.run_id }}
          path: |
            results/dynasent_multiseed/
            results/dynasent_analysis/${{ inputs.backend }}/
          if-no-files-found: error
          retention-days: 90
