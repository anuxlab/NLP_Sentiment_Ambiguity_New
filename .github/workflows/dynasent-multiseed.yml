name: DynaSent Multi-Seed Evaluation

on:
  workflow_dispatch:
    inputs:
      backend:
        description: 'Model backend for the multi-seed evaluation'
        required: true
        type: choice
        options: [tfidf, tiny-bert]
        default: tiny-bert
      seeds:
        description: 'Space-separated reproducibility seeds'
        required: true
        default: '0 1 2 3 4'
        type: string
      budget:
        description: 'Training examples per condition and seed'
        required: true
        default: '100'
        type: string
      epochs:
        description: 'Training epochs'
        required: true
        default: '10'
        type: string
      tiny_bert_lr:
        description: 'Learning rate for tiny-BERT (ignored for TF-IDF)'
        required: true
        default: '0.00002'
        type: string
      include_null_soft_only:
        description: 'Include the separately reported null-majority soft-target condition'
        required: true
        default: true
        type: boolean
      null_soft_fraction:
        description: 'Fraction of null-majority examples in the additional condition'
        required: true
        default: '0.5'
        type: string

permissions:
  contents: read

concurrency:
  group: dynasent-multiseed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Validate code and tests
        run: |
          python -m py_compile src/*.py tests/*.py
          bash -n run_all.sh run_dynasent_pilot.sh
          pytest -q tests
      - name: Validate and resolve run settings
        id: settings
        env:
          BACKEND_INPUT: ${{ inputs.backend }}
          SEEDS_INPUT: ${{ inputs.seeds }}
          BUDGET_INPUT: ${{ inputs.budget }}
          EPOCHS_INPUT: ${{ inputs.epochs }}
          TINY_BERT_LR_INPUT: ${{ inputs.tiny_bert_lr }}
          INCLUDE_NULL_INPUT: ${{ inputs.include_null_soft_only }}
          NULL_FRACTION_INPUT: ${{ inputs.null_soft_fraction }}
        shell: bash
        run: |
          python - <<'PY'
          import os, math
          backend = os.environ['BACKEND_INPUT'].strip()
          if backend not in {'tfidf', 'tiny-bert'}:
              raise SystemExit('backend must be tfidf or tiny-bert')
          seeds = os.environ['SEEDS_INPUT'].split()
          if not seeds or any(not s.isdigit() for s in seeds):
              raise SystemExit('seeds must be space-separated non-negative integers')
          if len(set(seeds)) != len(seeds):
              raise SystemExit('seeds must be unique')
          budget = int(os.environ['BUDGET_INPUT'])
          epochs = int(os.environ['EPOCHS_INPUT'])
          if budget < 2:
              raise SystemExit('budget must be >= 2')
          if epochs < 1:
              raise SystemExit('epochs must be positive')
          lr = float(os.environ['TINY_BERT_LR_INPUT'])
          if not math.isfinite(lr) or lr <= 0:
              raise SystemExit('tiny_bert_lr must be a finite positive number')
          fraction = float(os.environ['NULL_FRACTION_INPUT'])
          if not 0 < fraction < 1:
              raise SystemExit('null fraction must be between 0 and 1')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'backend={backend}\n')
              out.write('seeds=' + ' '.join(seeds) + '\n')
              out.write('include_null=' + os.environ['INCLUDE_NULL_INPUT'].lower() + '\n')
          print(f'backend={backend}; seeds={seeds}; budget={budget}; epochs={epochs}; tiny_bert_lr={lr}; null_fraction={fraction}')
          PY
      - name: Run full-test evaluation for both rounds
        env:
          PYTHONUNBUFFERED: '1'
          BACKEND: ${{ steps.settings.outputs.backend }}
          SEEDS: ${{ steps.settings.outputs.seeds }}
          BUDGET: ${{ inputs.budget }}
          EPOCHS: ${{ inputs.epochs }}
          TINY_BERT_LR: ${{ inputs.tiny_bert_lr }}
          INCLUDE_NULL: ${{ steps.settings.outputs.include_null }}
          NULL_FRACTION: ${{ inputs.null_soft_fraction }}
        shell: bash
        run: |
          read -r -a seeds_array <<< "$SEEDS"
          extra_args=()
          if [[ "$BACKEND" == "tiny-bert" ]]; then
            extra_args+=(--tiny-bert-lr "$TINY_BERT_LR")
          fi
          if [[ "$INCLUDE_NULL" == "true" ]]; then
            extra_args+=(--include-null-soft-only --null-soft-fraction "$NULL_FRACTION")
          fi
          for round_name in round1 round2; do
            echo "Starting full-test run: round=$round_name backend=$BACKEND seeds=$SEEDS budget=$BUDGET epochs=$EPOCHS"
            python src/run_dynasent_experiments.py \
              --data data/dynasent-main.zip \
              --round "$round_name" \
              --backend "$BACKEND" \
              --budget "$BUDGET" \
              --eval-size 0 \
              --epochs "$EPOCHS" \
              --seeds "${seeds_array[@]}" \
              --out-dir "results/dynasent_multiseed/$round_name" \
              "${extra_args[@]}"
          done
      - name: Aggregate multi-seed results and audit completeness
        shell: bash
        env:
          INCLUDE_NULL: ${{ steps.settings.outputs.include_null }}
        run: |
          aggregate_args=()
          if [[ "$INCLUDE_NULL" == "true" ]]; then
            aggregate_args+=(--expect-null-augmented)
          fi
          python src/aggregate_dynasent_multiseed.py \
            --results-root results/dynasent_multiseed \
            --rounds round1 round2 \
            "${aggregate_args[@]}"
      - name: Upload full-test multi-seed results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynasent-multiseed-${{ github.run_id }}
          path: results/dynasent_multiseed/
          if-no-files-found: error
          retention-days: 90
