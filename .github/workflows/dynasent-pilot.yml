name: DynaSent Soft-Target Pilot

on:
  # Weekly runs are opt-in: set repository variable ENABLE_WEEKLY_PILOT=true.
  schedule:
    - cron: '0 2 * * 0'  # Sundays at 02:00 UTC (job is skipped unless enabled)
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'data/dynasent-main.zip'
      - 'requirements.txt'
      - 'run_dynasent_pilot.sh'
      - '.github/workflows/dynasent-pilot.yml'
  workflow_dispatch:
    inputs:
      round:
        description: 'DynaSent round to run'
        required: true
        type: choice
        options: [round1, round2, both]
        default: both
      backend:
        description: 'TF-IDF is the quick offline-compatible baseline; tiny-bert uses the local MLM checkpoint'
        required: true
        type: choice
        options: [tfidf, tiny-bert]
        default: tfidf
      budget:
        description: 'Matched training budget per objective'
        required: true
        default: '100'
        type: string
      eval_size:
        description: 'Fixed test sample size; use 0 for full test split'
        required: true
        default: '500'
        type: string
      epochs:
        description: 'Training epochs for pilot'
        required: true
        default: '10'
        type: string

permissions:
  contents: read

concurrency:
  group: dynasent-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pilot:
    # Scheduled runs are disabled by default. Push and manual runs remain available.
    if: ${{ github.event_name != 'schedule' || vars.ENABLE_WEEKLY_PILOT == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Validate code and tests
        run: |
          python -m py_compile src/*.py tests/*.py
          bash -n run_all.sh run_dynasent_pilot.sh
          pytest -q tests
      - name: Resolve run settings
        id: settings
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ROUND: ${{ inputs.round }}
          INPUT_BACKEND: ${{ inputs.backend }}
          INPUT_BUDGET: ${{ inputs.budget }}
          INPUT_EVAL_SIZE: ${{ inputs.eval_size }}
          INPUT_EPOCHS: ${{ inputs.epochs }}
        run: |
          # Scheduled and push-triggered runs use conservative CPU defaults.
          echo "rounds=${INPUT_ROUND:-both}" >> "$GITHUB_OUTPUT"
          echo "backend=${INPUT_BACKEND:-tfidf}" >> "$GITHUB_OUTPUT"
          echo "budget=${INPUT_BUDGET:-100}" >> "$GITHUB_OUTPUT"
          echo "eval_size=${INPUT_EVAL_SIZE:-500}" >> "$GITHUB_OUTPUT"
          echo "epochs=${INPUT_EPOCHS:-10}" >> "$GITHUB_OUTPUT"
          echo "event=${EVENT_NAME}" >> "$GITHUB_OUTPUT"
      - name: Run pilot
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          rounds="${{ steps.settings.outputs.rounds }}"
          if [[ "$rounds" == "both" ]]; then rounds="round1 round2"; fi
          for round_name in $rounds; do
            python src/run_dynasent_experiments.py \
              --data data/dynasent-main.zip \
              --round "$round_name" \
              --backend "${{ steps.settings.outputs.backend }}" \
              --budget "${{ steps.settings.outputs.budget }}" \
              --eval-size "${{ steps.settings.outputs.eval_size }}" \
              --epochs "${{ steps.settings.outputs.epochs }}" \
              --seeds 0 \
              --out-dir "results/dynasent_pilot_${round_name}"
          done
      - name: Upload pilot outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynasent-pilot-${{ github.event_name }}-${{ github.run_id }}
          path: |
            results/dynasent_pilot_round1/
            results/dynasent_pilot_round2/
          if-no-files-found: warn
          retention-days: 30
