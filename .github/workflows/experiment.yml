name: Research Experiment (parallel CPU domains)

on:
  # Run automatically when experiment code or this workflow changes on main.
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'run_all.sh'
      - 'requirements.txt'
      - 'tests/**'
      - 'ci/**'
      - '.github/workflows/experiment.yml'
  # Weekly full reproduction; avoids consuming hours on every documentation edit.
  schedule:
    - cron: '0 2 * * 0' # Sundays at 02:00 UTC
  # Kept as an optional recovery/debug entry point; automation is not manual-only.
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: research-experiment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pretrain:
    name: Pretrain MLM once
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt tabulate pytest
      - name: Prepare output directories
        run: mkdir -p results/models results/logs results/preds
      - name: Run MLM pretraining once
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          cd src
          python pretrain_mlm.py --steps 5000 --lr 1e-3 --dropout 0.0 --save_steps 0,100,300,1000,2500,5000
      - name: Upload shared pretraining state
        uses: actions/upload-artifact@v4
        with:
          name: nlp-pretrain-${{ github.run_id }}
          path: |
            results/models/**
            results/logs/pretrain.jsonl
          if-no-files-found: error
          retention-days: 14

  domain-experiments:
    name: Domain experiments — ${{ matrix.domain }}
    needs: pretrain
    runs-on: ubuntu-latest
    timeout-minutes: 210
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        domain: [sst2, finance, airline]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt tabulate pytest
      - name: Prepare output directories
        run: mkdir -p results/models results/logs results/preds
      - name: Download shared MLM checkpoints
        uses: actions/download-artifact@v4
        with:
          name: nlp-pretrain-${{ github.run_id }}
          path: results
      - name: Run domain experiment
        env:
          PYTHONUNBUFFERED: '1'
          EXPERIMENT_DOMAIN: ${{ matrix.domain }}
        run: |
          cd src
          python run_experiments.py --stage all --domain "$EXPERIMENT_DOMAIN"
      - name: Measure model efficiency (SST-2 only)
        if: matrix.domain == 'sst2'
        run: |
          cd src
          python efficiency.py
      - name: Upload domain results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nlp-domain-${{ github.run_id }}-${{ matrix.domain }}
          path: |
            results/results.jsonl
            results/families.jsonl
            results/preds/**
            results/efficiency.json
            results/logs/**
            results/models/ft_*
          if-no-files-found: warn
          retention-days: 14

  finalize:
    name: Merge, analyze, audit
    needs: [pretrain, domain-experiments]
    if: always() && needs.pretrain.result == 'success' && needs.domain-experiments.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install analysis and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt tabulate pytest
      - name: Download each domain artifact
        uses: actions/download-artifact@v4
        with:
          pattern: nlp-domain-${{ github.run_id }}-*
          path: domain-artifacts
          merge-multiple: false
      - name: Merge domain evidence
        run: |
          python ci/merge_experiment_artifacts.py \
            --input-root domain-artifacts \
            --output-root results \
            --domains sst2 finance airline
      - name: Rebuild tables, plots and ambiguity analyses
        run: |
          cd src
          python make_assets.py
      - name: Recompute cross-domain paired bootstrap
        run: |
          cd src
          python cross_domain_stats.py --bootstrap 2000
      - name: Run integrity tests
        run: python -m pytest -q tests
      - name: Generate final evidence audit
        run: python ci/audit_evidence.py --output results/experiment_evidence_audit.json
      - name: Upload merged evidence and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nlp-experiment-final-${{ github.run_id }}
          path: |
            results/results.jsonl
            results/families.jsonl
            results/summary.md
            results/efficiency.json
            results/ambiguity*.json
            results/domain_pairwise_bootstrap.*
            results/experiment_evidence_audit.json
            results/logs/**
            results/preds/**
            results/all_runs.csv
            report/tables/**
            report/figures/**
          if-no-files-found: warn
          retention-days: 90

  report-failure:
    name: Report failed stage
    needs: [pretrain, domain-experiments, finalize]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Research pipeline failed. Inspect pretrain, matrix-domain, and finalize jobs." >&2
          exit 1
