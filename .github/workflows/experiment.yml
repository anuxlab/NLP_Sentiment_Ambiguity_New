name: Research Experiment (manual, CPU)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RUN to confirm a compute-intensive experiment'
        required: true
        type: string
      scope:
        description: 'Select the experiment scope'
        required: true
        type: choice
        options:
          - core-only
          - all-domains
      resume:
        description: 'Resume only when the matching checkpoint and logs are present'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: research-experiment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  experiment:
    if: ${{ inputs.confirmation == 'RUN' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt tabulate
      - name: Run requested experiment
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          if [[ "${{ inputs.resume }}" == "true" ]]; then
            if [[ "${{ inputs.scope }}" == "core-only" ]]; then
              bash run_all.sh --resume --core-only
            else
              bash run_all.sh --resume
            fi
          else
            if [[ "${{ inputs.scope }}" == "core-only" ]]; then
              bash run_all.sh --core-only
            else
              bash run_all.sh
            fi
          fi
      - name: Run post-experiment integrity checks
        if: success()
        run: |
          pytest -q tests
          python ci/audit_evidence.py --output results/experiment_evidence_audit.json
      - name: Upload experiment records and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nlp-experiment-${{ github.run_id }}
          path: |
            results/results.jsonl
            results/families.jsonl
            results/summary.md
            results/efficiency.json
            results/ambiguity*.json
            results/domain_pairwise_bootstrap.*
            results/experiment_evidence_audit.json
            results/logs/
            results/preds/
          if-no-files-found: warn
          retention-days: 30

  skipped-without-confirmation:
    if: ${{ inputs.confirmation != 'RUN' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'No experiment was run. Re-run workflow_dispatch and type RUN to confirm compute usage.'
